experiment_name: OGSRV0_PRED_TEXTURE_PREDICTOR

dataset:
  train_manifest: manifests/stage2_v2_clean_human_reviewed_20260624/predicted_prior/train.jsonl
  val_manifest: manifests/stage2_v2_clean_human_reviewed_20260624/predicted_prior/val.jsonl
  test_manifest: manifests/stage2_v2_clean_human_reviewed_20260624/predicted_prior/test.jsonl
  prior_type: predicted
  input_mode: pre_sar_texture_prior
  sar_shuffle_mode: paired
  sar_singleton_policy: error
  crop_size: 512
  intact_boundary_weight: 0.25
  gate_threshold: 0.6

augmentation:
  hflip: true
  vflip: false
  rotate90: true
  crop_probabilities:
    damaged: 0.4
    destroyed: 0.4
    building: 0.2
    random: 0.0

model:
  name: simple_unet
  in_channels: 4
  out_channels: 2

train:
  batch_size: 8
  eval_batch_size: 2
  epochs: 40
  num_workers: 8
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0
  early_stopping_min_epochs: 12
  seed: 42
