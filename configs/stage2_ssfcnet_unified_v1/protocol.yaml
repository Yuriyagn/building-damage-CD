external_method:
  name: SSFCNet
  model_name: external_ssfcnet
  checkout_root: ../ssfcnet_reproduction_20260731/historical_284d0bf
  git_commit: 284d0bf608eb4302cd47e3959e36deb4e300cf6f
  upstream_head_commit: a18709098736dfe3b1984bd7c51bd7da9afeb624
  release_status: historical_model_deleted_from_current_master
  training_entrypoint_available: false
  formal_license_file_available: false
  artifacts:
    source:
      path: model/SSFCNet.py
      sha256: 8d6230e545257def938072b0ce6bf2002d3b315a57c86b7b9fccc689b7562e55
    boundary_loss_reference:
      path: utils/loss.py
