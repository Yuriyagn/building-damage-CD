  source_boundary: external_not_vendored

method_scope:
  primary_gate: author_architecture_under_unified_project_loss
  architecture:
    - shared_siamese_encoder
    - wavelet_spatial_frequency_encoder
    - explicit_difference_correlation_guidance
    - inverse_wavelet_decoder
  boundary_aware_loss: deferred_separate_ablation_after_primary_gate
  rationale: isolate_architecture_before_changing_the_three_grade_objective

training:
  seeds: [42, 3407, 2026]
  crop_size: 512
  effective_batch_size: 8
  max_epochs: 40
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  loss: building_only_ce_binary_aux
  binary_aux_weight: 0.3
  primary_checkpoint: best_bo_grade_macro_f1.pth

evaluation:
  primary_metric: building_only_macro_f1_3class
  required_secondary_metrics:
    - building_only_f1_damaged
    - building_only_f1_destroyed
    - building_only_damage_macro_f1
    - building_only_damage_binary_f1
    - predicted_gate_macro_f1_4class
    - predicted_gate_damage_macro_f1
    - per_event_metrics
    - per_disaster_metrics
  prohibited_selection_metrics:
    - test_metrics
    - cc_surrogate

advancement_gate:
  technical:
    smoke_status: ok
    overfit_max_batches: 2
    overfit_min_relative_loss_reduction: 0.30
  seed42:
    reference_e2_argmax_bo_macro_f1: 0.35861372026578153
    minimum_paired_minus_shuffled_bo_macro_f1: 0.01
    require_both: true
  three_seed_rule: run_only_after_seed42_gate_passes

artifact_policy:
  retain_checkpoints_per_completed_run: 1
  retain_logs_and_scalar_metrics: true
  retain_generated_previews: false
  retain_generated_predictions: false
