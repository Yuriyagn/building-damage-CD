protocol_id: stage2_ssfcnet_unified_v1
experiment_name: S2SF1_SSFCNet_shuffled

dataset:
  train_manifest: manifests/stage2_v2_clean_human_reviewed_20260624/predicted_prior/train.jsonl
  val_manifest: manifests/stage2_v2_clean_human_reviewed_20260624/predicted_prior/val.jsonl
  test_manifest: manifests/stage2_v2_clean_human_reviewed_20260624/predicted_prior/test.jsonl
  prior_type: predicted
  input_mode: pre_sar_prior
  sar_shuffle_mode: within_event
  sar_shuffle_seed: 20260731
  sar_singleton_policy: error
  crop_size: 512
  gate_threshold: 0.6

augmentation:
  hflip: true
  vflip: false
  rotate90: true
  crop_probabilities:
    damaged: 0.4
    destroyed: 0.4
    building: 0.2
    random: 0.0

target:
  num_classes: 3
  class_names: [intact, damaged, destroyed]
  loss_support: gt_building

model:
  name: external_ssfcnet
  external_root: ../ssfcnet_reproduction_20260731/historical_284d0bf
  source_commit: 284d0bf608eb4302cd47e3959e36deb4e300cf6f
  source_sha256: 8d6230e545257def938072b0ce6bf2002d3b315a57c86b7b9fccc689b7562e55
  stream_a_channels: [0, 1, 2]
  stream_b_channels: [3, 4, 5]
  normalization: upstream_minus_one_one
  shared_encoder: true
  use_iwt_decoder: true
  use_diffcorr: true
  norm: gn
  padding_mode: reflect
  auto_pad: true
  in_channels: 6
  out_channels: 3

loss:
  name: building_only_ce_binary_aux
  binary_aux_weight: 0.3
  binary_pos_weight: 1.0
  class_weight_strategy: median_frequency
  max_class_weight: 8.0

train:
  batch_size: 8
  gradient_accumulation_steps: 1
  eval_batch_size: 8
  epochs: 40
  num_workers: 8
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  disaster_sampling_alpha: 0.0
  early_stopping_window: 3
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0
  early_stopping_min_epochs: 12
  checkpoint_policy: primary_only
  save_last_checkpoint: false
  seed: 42
