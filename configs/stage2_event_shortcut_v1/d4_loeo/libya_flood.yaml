experiment_name: S2ES_D4_LOEO_libya_flood
dataset:
  train_manifest: manifests/stage2_event_shortcut_v1/d4_loeo/libya_flood/train.jsonl
  val_manifest: manifests/stage2_event_shortcut_v1/d4_loeo/libya_flood/val.jsonl
  test_manifest: manifests/stage2_event_shortcut_v1/d4_loeo/libya_flood/val.jsonl
  prior_type: predicted
  input_mode: pre_sar_prior
  sar_shuffle_mode: paired
  sar_singleton_policy: error
  crop_size: 512
  gate_threshold: 0.6
augmentation:
  hflip: true
  vflip: false
  rotate90: true
  crop_probabilities:
    damaged: 0.4
    destroyed: 0.4
    building: 0.2
    random: 0.0
target:
  num_classes: 3
  class_names:
  - intact
  - damaged
  - destroyed
  loss_support: gt_building
model:
  name: unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 6
  out_channels: 3
loss:
  name: building_only_ce_binary_aux
  binary_aux_weight: 0.3
  binary_pos_weight: 1.0
  class_weight_strategy: median_frequency
  max_class_weight: 8.0
train:
  batch_size: 8
  eval_batch_size: 4
  epochs: 40
  num_workers: 8
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  disaster_sampling_alpha: 0.0
  early_stopping_window: 3
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0
  early_stopping_min_epochs: 12
  seed: 42
  checkpoint_policy: primary_only
  save_last_checkpoint: false
protocol_id: stage2_event_shortcut_v1
diagnostic:
  id: D4
  holdout_event: libya_flood
  source_split: strict_clean_train_only
  formal_test_embargoed: true
