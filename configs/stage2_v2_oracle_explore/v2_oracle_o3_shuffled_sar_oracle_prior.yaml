experiment_name: V2_ORACLE_O3_shuffled_sar_oracle_prior

dataset:
  train_manifest: manifests/stage2_v2_clean_human_reviewed_20260624/oracle_prior/train.jsonl
  val_manifest: manifests/stage2_v2_clean_human_reviewed_20260624/oracle_prior/val.jsonl
  test_manifest: manifests/stage2_v2_clean_human_reviewed_20260624/oracle_prior/test.jsonl
  prior_type: oracle
  input_mode: sar_prior
  sar_shuffle_mode: within_event
  sar_shuffle_seed: 20260625
  sar_singleton_policy: error
  crop_size: 512
  gate_threshold: 0.5

augmentation:
  hflip: true
  vflip: false
  rotate90: true
  crop_probabilities:
    damaged: 0.4
    destroyed: 0.4
    building: 0.2
    random: 0.0

target:
  num_classes: 3
  class_names: [intact, damaged, destroyed]
  loss_support: gt_building

model:
  name: unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 3
  out_channels: 3

loss:
  name: building_only_ce
  class_weight_strategy: median_frequency
  max_class_weight: 8.0

train:
  batch_size: 8
  eval_batch_size: 4
  epochs: 40
  num_workers: 8
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  disaster_sampling_alpha: 0.0
  early_stopping_window: 3
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0
  early_stopping_min_epochs: 12
  seed: 42
