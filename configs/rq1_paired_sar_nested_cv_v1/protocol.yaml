protocol_id: rq1_paired_sar_nested_cv_v1.2
evidence_scope: nested_cv_development_only_no_blind_confirmation
research_question: >-
  Does sample-aligned post-event SAR add transferable damage-grade information
  beyond pre-event RGB and an event-excluded OOF building prior?
outer_folds: 7
outer_unit: paired canonical disaster events
inner_validation_rule: next outer pair cyclically
conditions: [C0, C1, C2, C3]
seeds: [42, 3407, 2026]
primary_estimand: C2_minus_C3_event_macro_damage_f1
secondary_estimand: C2_minus_C1_event_macro_damage_f1
stage1:
  seed: 42
  optimizer_steps: 20000
  checkpoint_selection: none_fixed_final_step
stage2:
  optimizer_steps: 20000
  inner_eval_steps: [4000, 6000, 8000, 10000, 12000, 14000, 16000, 18000, 20000]
  common_checkpoint_rule: maximize_mean_inner_event_macro_bo_grade_f1_across_C1_C2_C3_tie_earlier
advancement_gate:
  technical:
    overfit_min_relative_loss_reduction: 0.50
  scientific:
    mean_C2_minus_C3_min: 0.02
    positive_seed_fraction: 0.6666666667
    positive_event_count_min: 9
    mean_C2_minus_C1_min: 0.01
    damaged_or_destroyed_delta_floor: -0.01
    worst_event_bo_delta_floor: -0.01
claims:
  blind_confirmation_eligible: false
  geospatial_independence_eligible: false
  codabench_feedback_allowed: false
