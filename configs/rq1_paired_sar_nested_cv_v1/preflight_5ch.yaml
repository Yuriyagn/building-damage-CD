experiment_name: rq1_preflight_5ch_nonformal

dataset:
  train_manifest: manifests/stage2_v2_event_group_bright_r4_predicted_v1_20260803/predicted_prior/train.jsonl
  val_manifest: manifests/stage2_v2_event_group_bright_r4_predicted_v1_20260803/predicted_prior/val.jsonl
  test_manifest: manifests/stage2_v2_event_group_bright_r4_predicted_v1_20260803/predicted_prior/test.jsonl
  prior_type: predicted
  input_mode: pre_prior_sar5
  sar_shuffle_mode: paired
  crop_size: 512
  gate_threshold: 0.6

augmentation:
  hflip: true
  vflip: false
  rotate90: true
  crop_probabilities: {damaged: 0.4, destroyed: 0.4, building: 0.2, random: 0.0}

target:
  num_classes: 3
  class_names: [intact, damaged, destroyed]
  loss_support: gt_building

model:
  name: unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 5
  out_channels: 3

loss:
  name: building_only_ce
  class_weight_strategy: median_frequency
  max_class_weight: 8.0

train:
  batch_size: 8
  eval_batch_size: 4
  epochs: 1
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  sampling_strategy: default
  deterministic: true
  seed: 42
